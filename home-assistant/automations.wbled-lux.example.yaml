# Пример: ночник ch1 по уличному lux (опционально)
# Скопируй в automations.yaml или создай через UI.
# Управление только через script — light не дёргается от raw.

- alias: "WBLED ch1: ночник по lux"
  description: "1% в темноте, плавно до сумерек, выкл днём"
  mode: single
  triggers:
    - trigger: state
      entity_id: sensor.lux_out_illuminance
  conditions:
    - condition: template
      value_template: "{{ has_value('sensor.lux_out_illuminance') }}"
    - condition: template
      value_template: >-
        {{ (now() - (this.attributes.last_triggered | default(as_datetime(0), true)))
           > timedelta(seconds=90) }}
  actions:
    - variables:
        lux: "{{ states('sensor.lux_out_illuminance') | float(500) }}"
        target_pct: >-
          {% if lux < 50 %}1
          {% elif lux > 800 %}0
          {% else %}{{ (1 + 99 * ((800 - lux) / 750) ** 0.5) | round(0) | int }}
          {% endif %}
        value_255: "{{ (target_pct | int * 255 / 100) | int }}"
    - action: script.wbled_65_ch1_set
      data:
        value: "{{ value_255 }}"
