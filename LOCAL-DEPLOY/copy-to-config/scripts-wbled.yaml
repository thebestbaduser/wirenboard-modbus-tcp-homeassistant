# =====================================================================
# WB-LED: вставить в /config/scripts.yaml (добавить или заменить блок)
# =====================================================================
# Единственная точка записи в Modbus. Lux и UI вызывают script.wbled_65_ch*_set.
# input_number.wbled_65_ch*_brightness — источник истины для light.*
# sensor.wbled_65_ch*_raw — только диагностика
# =====================================================================

wbled_65_ch1_set:
  alias: WB-LED 65 ch1 set
  mode: queued
  max: 5
  fields:
    value:
      description: "Brightness 0..255"
      example: 128
  sequence:
    - variables:
        v: "{{ [[value | int(0), 0] | max, 255] | min }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.wbled_65_ch1_brightness
      data:
        value: "{{ v }}"
    - action: modbus.write_register
      data:
        hub: wb_gateway
        slave: 65
        address: 90
        value: "{{ (v * 2048 / 255) | int }}"

