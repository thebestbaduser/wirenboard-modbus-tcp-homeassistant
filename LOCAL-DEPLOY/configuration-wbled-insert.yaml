                {% set b = states('input_number.wbled_65_ch2_brightness') | int(0) %}
                {{ b if b > 0 else 255 }}
        turn_off:
          - action: script.wbled_65_ch2_set
            data:
              value: 0
        set_level:
          - action: script.wbled_65_ch2_set
            data:
              value: "{{ brightness }}"

      - unique_id: wbled_65_ch3
        name: "WBLED_65_CH3"
        default_entity_id: light.wbled_65_ch3
        state: "{{ states('input_number.wbled_65_ch3_brightness') | int(0) > 0 }}"
        level: "{{ states('input_number.wbled_65_ch3_brightness') | int(0) }}"
        turn_on:
          - action: script.wbled_65_ch3_set
            data:
              value: >-
                {% set b = states('input_number.wbled_65_ch3_brightness') | int(0) %}
